<svg viewBox="0 0 900 24" width="900" height="24" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00ff41" stop-opacity="0.0"/>
      <stop offset="15%"  stop-color="#00ff41" stop-opacity="0.9"/>
      <stop offset="45%"  stop-color="#00ff41" stop-opacity="1.0"/>
      <stop offset="55%"  stop-color="#00ff41" stop-opacity="1.0"/>
      <stop offset="85%"  stop-color="#00ff41" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="24" fill="#000000"/>
  <line x1="0" y1="12" x2="900" y2="12" stroke="url(#line)" stroke-width="1" filter="url(#glow)"/>
  <text x="450" y="16" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" fill="#00ff41" fill-opacity="0.7" filter="url(#glow)">◆</text>
</svg>

<svg viewBox="0 0 900 100" width="900" height="100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00ff41" stop-opacity="0.0"/>
      <stop offset="20%"  stop-color="#00ff41" stop-opacity="0.08"/>
      <stop offset="50%"  stop-color="#00ff41" stop-opacity="0.12"/>
      <stop offset="80%"  stop-color="#00ff41" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="borderH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00ff41" stop-opacity="0.0"/>
      <stop offset="20%"  stop-color="#00ff41" stop-opacity="0.6"/>
      <stop offset="80%"  stop-color="#00ff41" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="100" fill="#000000"/>
  <!-- Glass pill -->
  <rect x="50" y="10" width="800" height="80" rx="12" fill="url(#panelGrad)"/>
  <rect x="50" y="10" width="800" height="80" rx="12" fill="none" stroke="url(#borderH)" stroke-width="1"/>
  <!-- Top shine -->
  <rect x="51" y="11" width="798" height="20" rx="11" fill="#00ff41" fill-opacity="0.04"/>
</svg>
